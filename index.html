<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Produtos Fox ESS — Brasil</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; background: #FFFFFF; color: #1a1a2e; line-height: 1.6; }
.alert-box {
  background-color: #fff5f5;
  border-left: 4px solid #e53e3e;
  color: #c53030;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 0.85em;
  margin-top: 14px;
  line-height: 1.4;
}
/* ===== COVER ===== */
.cover { background: linear-gradient(135deg, #2E0059 0%, #8655FF 50%, #5B2EBC 100%); color: white; padding: 80px 40px; text-align: center; min-height: 400px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.cover img { max-width: 300px; height: auto; margin-bottom: 30px; }
.cover h1 { font-size: 2.5em; font-weight: 700; margin-bottom: 10px; }
.cover p { font-size: 1.2em; opacity: 0.9; }
.cover-stats { display: flex; gap: 40px; margin-top: 30px; }
.cover-stat { text-align: center; }
.cover-stat .num { font-size: 2em; font-weight: 700; color: #25E577; }
.cover-stat .label { font-size: 0.85em; opacity: 0.8; text-transform: uppercase; }

/* ===== NAVIGATION (Sumário) ===== */
.nav { background: #FFFFFF; border-bottom: 2px solid #8655FF; padding: 20px 40px; position: sticky; top: 0; z-index: 100; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; box-shadow: 0 2px 8px rgba(134,85,255,0.1); }
.nav-title { font-size: 0.85em; font-weight: 700; color: #2E0059; text-transform: uppercase; letter-spacing: 1px; margin-right: 8px; }
.nav a { color: #2E0059; text-decoration: none; font-weight: 600; font-size: 0.9em; padding: 10px 20px; border-radius: 10px; transition: all 0.25s; border: 2px solid #E5E5E5; background: #FFFFFF; display: inline-flex; align-items: center; gap: 6px; }
.nav a:hover { background: #8655FF; color: #FFFFFF; border-color: #8655FF; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(134,85,255,0.3); }
.nav a .nav-count { background: #B69FFF; color: #2E0059; padding: 2px 8px; border-radius: 10px; font-size: 0.85em; font-weight: 700; }
.nav a:hover .nav-count { background: #25E577; color: #FFFFFF; }

/* ===== COMPANY INTRO ===== */
.company-intro { max-width: 900px; margin: 40px auto; padding: 32px 40px; background: linear-gradient(135deg, #F5F0FF 0%, #FFFFFF 100%); border-left: 5px solid #8655FF; border-radius: 0 16px 16px 0; }
.company-intro h3 { color: #2E0059; font-size: 1.3em; font-weight: 700; margin-bottom: 12px; }
.company-intro p { color: #4a4a6a; font-size: 1em; line-height: 1.8; margin-bottom: 8px; }
.company-intro .highlight-green { color: #8655FF; font-weight: 600; }

/* ===== CATEGORY SECTIONS ===== */
.category-section { padding: 40px; max-width: 1400px; margin: 0 auto; }
.category-header { font-size: 1.8em; font-weight: 700; margin-bottom: 30px; padding-bottom: 10px; border-bottom: 3px solid; display: flex; align-items: center; gap: 12px; }
.category-count { font-size: 0.6em; background: #E5E5E5; color: #2E0059; padding: 4px 12px; border-radius: 20px; font-weight: 600; }

/* ===== PRODUCT CARDS ===== */
.product-card { background: #FFFFFF; border-radius: 16px; box-shadow: 0 2px 8px rgba(46,0,89,0.08); margin-bottom: 24px; overflow: hidden; display: grid; grid-template-columns: 280px 1fr; min-height: 320px; border: 1px solid #f0f0f0; }
.product-card:hover { box-shadow: 0 4px 16px rgba(134,85,255,0.15); }
.product-photo { background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 20px; border-right: 1px solid #f0f0f0; }
.product-photo img { max-width: 100%; max-height: 280px; object-fit: contain; }
.product-photo .placeholder { width: 120px; height: 120px; border: 2px dashed #E5E5E5; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #B69FFF; font-size: 0.8em; text-align: center; }
.product-details { padding: 24px 30px; }
.product-name { font-size: 1.4em; font-weight: 700; color: #2E0059; }
.product-part { font-size: 0.95em; color: #8a8a9a; font-family: monospace; margin-top: 2px; }
.specs { width: 100%; margin-top: 16px; border-collapse: collapse; }
.specs td { padding: 6px 12px; border-bottom: 1px solid #f5f5f5; font-size: 0.9em; }
.specs td:first-child { font-weight: 600; color: #5B2EBC; width: 180px; }
.specs td:last-child { color: #1a1a2e; }
.specs .highlight { background: #F5F0FF; }
.specs .highlight td:first-child { color: #8655FF; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.8em; margin: 2px; }
.tag-blue { background: #E8E0FF; color: #5B2EBC; }
.documents { margin-top: 16px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
.documents h4 { font-size: 0.85em; color: #8a8a9a; text-transform: uppercase; margin-bottom: 8px; }
